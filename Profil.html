<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <style>
    body {
      margin:0;
      font-family:'Poppins', sans-serif;
      background:#111;
      color:#fff;
    }
    header {
      background:rgba(0,0,0,0.7);
      padding:10px;
      text-align:center;
      position:fixed;
      width:100%;
      top:0;
      z-index:10;
    }
    header h1 { margin:0; font-size:1.5em; }
    .hero {
      position:relative;
      height:100vh;
      overflow:hidden;
    }
    .hero img {
      width:100%;
      height:100%;
      object-fit:cover;
      filter:blur(3px) brightness(0.7);
    }
    canvas#rain {
      position:absolute;
      top:0; left:0;
      width:100%; height:100%;
      z-index:2; pointer-events:none;
    }
    .overlay {
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      z-index:3;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
    }
    .widget {
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(6px);
      padding:20px;
      border-radius:10px;
      width:200px;
      text-align:center;
      transition:transform 0.3s ease, box-shadow 0.3s ease;
    }
    .widget:hover {
      transform:translateY(-5px);
      box-shadow:0 0 20px rgba(255,255,255,0.3);
    }
    .widget h3 {
      margin:0 0 10px;
      font-size:1.2em;
    }
    .widget a {
      color:#ffcc00;
      text-decoration:none;
      font-weight:bold;
    }
    footer {
      background:#000;
      color:#fff;
      text-align:center;
      padding:15px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Profil</h1>
  </header>

  <!-- Hero Section dengan Widget -->
  <section class="hero">
    <img src="bg.png" alt="Foto Profil">
    <canvas id="rain"></canvas>
    <div class="overlay">
      <div class="widget">
        <h3>YouTube</h3>
        <p>Channel musik & anime</p>
        <a href="https://youtu.be/cSByWyg3wPA?si=PMOIqPYP21XhqvRe" target="_blank">Listen it</a>
      </div>
      <div class="widget">
        <h3>Etterna</h3>
        <p>Rhythm Game Profile</p>
        <a href="https://etternaonline.com/users/ElainaMyBeloved" target="_blank">Link</a>
      </div>
      <div class="widget">
        <h3>GitHub</h3>
        <p>Proyek coding & web design</p>
        <a href="https://github.com/yourprofile" target="_blank">Explore</a>
      </div>
    </div>
  </section>

 

  <script>
    const canvas = document.getElementById("rain");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = document.querySelector(".hero").offsetHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let drops = [];
    for(let i=0; i<200; i++){
      drops.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        speed: 2+Math.random()*3
      });
    }

    function drawRain(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.lineWidth = 1;
      for(let d of drops){
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y+10);
        ctx.stroke();
        d.y += d.speed;
        if(d.y > canvas.height) {
          d.y = 0;
          d.x = Math.random()*canvas.width;
        }
      }
      requestAnimationFrame(drawRain);
    }
    drawRain();
  </script>
</body>
</html>
