<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenal Lebih Dekat - Ardhana</title>
  <style>
    body {
      margin:0;
      font-family: 'Poppins', sans-serif;
      background:#111;
      color:#fff;
    }
    header {
      background:rgba(0,0,0,0.7);
      padding:10px;
      text-align:center;
      position:fixed;
      width:100%;
      top:0;
      z-index:10;
    }
    header h1 {
      margin:0;
      font-size:1.5em;
    }

    .btn {
  display:inline-block;
  padding:10px 20px;
  background:#ff6600;
  color:#fff;
  font-size:1em;
  border-radius:5px;
  text-decoration:none;
  transition: all 0.3s ease;
}
    .container {
      display:flex;
      justify-content:space-between;
      align-items:center;
      height:100vh;
      padding-top:60px; /* biar header tidak nutup */
      position:relative;
      overflow:hidden;
    }
    .side-img {
      width:25%;
      height:80%;
      object-fit:cover;
      border-radius:10px;
      box-shadow:0 0 15px rgba(0,0,0,0.7);
    }
    .center-content {
      flex:1;
      margin:0 20px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(6px);
      padding:30px;
      border-radius:15px;
      text-align:center;
      position:relative;
      z-index:2;
    }
    .center-content h2 {
      font-size:2em;
      margin-bottom:15px;
    }
    .center-content p {
      font-size:1.2em;
      line-height:1.6;
    }
    canvas#drops {
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none;
    }
    footer {
      background:#000;
      color:#fff;
      text-align:center;
      padding:15px;
      position:absolute;
      bottom:0;
      width:100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kenal Lebih Dekat</h1>
  </header>

  <div class="container">
    <img src="foto.jpeg" alt="Foto Kiri" class="side-img">
    <canvas id="drops"></canvas>
    <div class="center-content">
      <h2 align="left">Ardhana Mahsa Danuva</h2>
      <p align="left">Umur: 18</p>
       <p align="left">Sekolah: SMK 3 Perguruan Cikini </p>
       <p align="left">Favorite: Chahan(Nasi Goreng Chinese)😋</p>
       <p align="left">Gear: Sayodevice Cm51, Msi Thin 15, Everglide AE64 Pro</p>
      <p align="left">Alamat: Jagakarsa, Lenteng agung No 10 </p>
      
    </div>
  <script>
    const canvas = document.getElementById("drops");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    class Drop {
      constructor() {
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.radius = 2+Math.random()*3;
        this.speed = 1+Math.random()*2;
      }
      fall() {
        this.y += this.speed;
        if(this.y > canvas.height) {
          this.y = 0;
          this.x = Math.random()*canvas.width;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        ctx.fill();
      }
    }

    let drops = [];
    for(let i=0; i<150; i++){
      drops.push(new Drop());
    }

    function animate() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for(let d of drops){
        d.fall();
        d.draw();
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
